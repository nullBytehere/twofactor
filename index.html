<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("fm-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")}catch(e){}</script>
<title>File Manager & Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f9f9f9;--card:#fff;--line:#ececf0;--text:#16181d;--mute:#8a8f9a;--pri:#3b5bf5;--priH:#2d49d6;--soft:#eef1ff;--hov:#f5f6fa;--th:#eceef3;--nav:#555;--hdr:rgba(255,255,255,.94);--shadow:rgba(30,40,90,.1);--err:#b42318;--sb:236px;--hh:64px;color-scheme:light}
:root[data-theme=dark]{--bg:#0f1115;--card:#181b22;--line:#262a33;--text:#e8eaf0;--mute:#8b92a1;--pri:#5f7bff;--priH:#7890ff;--soft:#222a4a;--hov:#1f232c;--th:#222631;--nav:#b4bacb;--hdr:rgba(24,27,34,.92);--shadow:rgba(0,0,0,.45);--err:#ff8a80;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);transition:background .2s,color .2s}
body.lock{overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
svg{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* sidebar */
.sb{position:fixed;inset:0 auto 0 0;width:var(--sb);background:var(--card);border-right:1px solid var(--line);overflow-y:auto;z-index:40;transition:transform .25s}
.brand{display:flex;align-items:center;gap:10px;height:var(--hh);padding:0 18px;font-size:18px;font-weight:500;border-bottom:1px solid var(--line)}
.brand svg{font-size:26px;color:var(--pri);stroke-width:3}
.sb h6{font-size:12px;letter-spacing:.12em;color:var(--nav);margin:22px 18px 8px;font-weight:500}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 18px;color:var(--nav);font-weight:500;position:relative}
.nav a:hover{background:var(--hov)}
.nav a.on{color:var(--pri)}
.nav a.on::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;background:var(--pri);border-radius:0 3px 3px 0}
.nav span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scrim{cursor:pointer;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
body.open .scrim{opacity:1;visibility:visible}
.main{margin-left:var(--sb);transition:margin .25s;min-width:0}
body.col .sb{transform:translateX(-100%)}
body.col .main{margin-left:0}

/* sticky header */
header{position:sticky;top:0;z-index:20;min-height:var(--hh);display:flex;align-items:center;gap:12px;padding:0 24px;background:var(--hdr);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tg{width:30px;height:30px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:16px;transition:transform .25s;flex:none}
body.col .tg{transform:rotate(180deg)}
.pill,.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-weight:500;flex:none}
.pill{padding:0 14px}
.ibtn{width:36px;font-size:17px}
.pill:hover,.ibtn:hover{background:var(--soft);color:var(--pri);border-color:var(--pri)}
.sbx{display:none;margin-left:auto}
.crumbs{flex:1;min-width:0;display:flex;align-items:center;gap:8px;overflow-x:auto;white-space:nowrap;scrollbar-width:none;color:var(--mute)}
.crumbs::-webkit-scrollbar{display:none}
.crumbs a:hover{color:var(--pri)}
.crumbs b{color:var(--text);font-weight:500}
.search{position:relative;width:240px}
.search input{width:100%;height:38px;padding:0 38px 0 14px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:14px;background:var(--card);color:var(--text)}
.search input:focus{outline:2px solid var(--pri);outline-offset:0;border-color:transparent}
.search svg{position:absolute;right:12px;top:11px;color:var(--mute);font-size:16px;pointer-events:none}

/* content */
.wrap{padding:26px 26px 60px;max-width:1600px}
.title{display:flex;align-items:center;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:22px}
.title h1{font-size:18px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.title small{color:var(--mute);flex:none}
.back{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:8px;background:var(--pri);color:#fff;font-weight:500;flex:none}
.back:hover{background:var(--priH)}
h2{font-size:20px;font-weight:500;margin:6px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:28px;margin-bottom:34px}
.card{display:block;min-width:0;background:var(--card);border-radius:8px;padding:14px;transition:box-shadow .2s}
.card:hover{box-shadow:0 6px 22px var(--shadow)}
.th{aspect-ratio:345/240;border-radius:8px;overflow:hidden;background:var(--th);position:relative;display:grid;place-items:center}
.th img,.th video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.th img:not(.bl),.th video{object-fit:contain}
.th video{background:#000}
.th .bl{filter:blur(16px) brightness(.85);transform:scale(1.25)}
body.fill .th img:not(.bl),body.fill .th video{object-fit:cover;object-position:top center}
body.fill .th .bl{display:none}
.th.dir{background:var(--soft);color:var(--pri);font-size:60px}
.th.dir svg{stroke-width:1.5}
.th.file b{font-size:20px;font-weight:600;color:var(--mute);padding:8px 16px;border:2px solid var(--line);border-radius:8px}
.play{position:absolute;width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;font-size:20px}
.play svg{fill:#fff;margin-left:3px}
.meta{margin-top:10px;font-size:12px;color:var(--mute)}
.nm{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:15px}
.nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{width:22px;height:22px;border-radius:6px;background:var(--soft);color:var(--pri);display:grid;place-items:center;font-size:13px;flex:none}

/* states */
.state{display:flex;flex-direction:column;align-items:center;gap:14px;padding:90px 20px;color:var(--mute);text-align:center}
.state.err{color:var(--err)}
.state p{max-width:460px}
.spin,.stage.ld::after{width:38px;height:38px;border:3px solid var(--soft);border-top-color:var(--pri);border-radius:50%;animation:s .8s linear infinite}
.btn{height:36px;padding:0 16px;border-radius:8px;background:var(--pri);color:#fff;font-weight:500}
@keyframes s{to{transform:rotate(360deg)}}

/* lightbox */
.lb{position:fixed;inset:0;z-index:100;background:rgba(8,10,16,.95);opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.lb.show{opacity:1;visibility:visible}
.stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:60px 76px 64px}
.stage{touch-action:none}
.stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px;touch-action:none;user-select:none;-webkit-user-drag:none;cursor:zoom-in}
.stage.zoomed img{cursor:grab}
.stage.ld img{opacity:0}
.stage.ld::after{position:absolute;border-color:rgba(255,255,255,.25);border-top-color:#fff}
.lbb{position:absolute;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;font-size:22px;z-index:2}
.lbb:hover{background:rgba(255,255,255,.28)}
.lbx{top:14px;right:14px}.pv,.nx{top:50%;margin-top:-22px}.pv{left:14px}.nx{right:14px}
.cap{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:16px;right:16px;text-align:center;color:#d6d9e2;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* tools: filter, sort, hover preview */
.tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;margin:-8px 0 22px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;max-width:100%;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{height:34px;padding:0 14px;border:1px solid var(--line);border-radius:17px;background:var(--card);display:inline-flex;align-items:center;gap:7px;font-weight:500;white-space:nowrap;flex:none}
.chip small{color:var(--mute);font-weight:400;font-size:12px}
.chip:hover{border-color:var(--pri);color:var(--pri)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chip.on small{color:rgba(255,255,255,.82)}
.opts{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.sel,.sw{display:flex;align-items:center;gap:8px;color:var(--mute)}
.sel select{height:34px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit;cursor:pointer;max-width:100%}
.sw{cursor:pointer;position:relative}
.sw span{color:var(--text)}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw i{width:38px;height:22px;border-radius:11px;background:var(--line);position:relative;transition:background .2s;flex:none}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .2s}
.sw input:checked+i{background:var(--pri)}
.sw input:checked+i::after{transform:translateX(16px)}
.sw input:focus-visible+i{outline:2px solid var(--pri);outline-offset:2px}
.play{transition:opacity .2s}
.card.hv .play{opacity:0}
@media(hover:none){.sw{display:none}}
/* folder collage thumbnails */
.mos{position:absolute;inset:0;display:grid;gap:2px;background:var(--card)}
.mos.m1{grid-template:1fr/1fr}
.mos.m2{grid-template:1fr/1fr 1fr}
.mos.m3{grid-template:1fr 1fr/1.5fr 1fr}
.mos.m3 .ct:first-child{grid-row:span 2}
.mos.m4{grid-template:1fr 1fr/1fr 1fr}
.ct{position:relative;overflow:hidden;background:var(--th);display:block;min-width:0;min-height:0}
.th .ct img,.th .ct video{position:static;width:100%;height:100%;display:block;object-fit:cover!important;object-position:center!important;transform:none}
.fbadge{position:absolute;left:8px;bottom:8px;width:30px;height:30px;border-radius:8px;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;font-size:16px;font-style:normal;backdrop-filter:blur(4px)}
.fbadge svg{stroke-width:2}
/* zoom bar */
.zbar{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;background:rgba(255,255,255,.12);border-radius:24px;padding:2px;z-index:2;color:#fff}
.zbar button{height:40px;min-width:40px;border-radius:20px;display:grid;place-items:center;font-size:18px;color:#fff}
.zbar button:hover{background:rgba(255,255,255,.22)}
.zbar #zl{font-size:13px;min-width:58px}
/* video player */
.vp{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#000;border-radius:8px;overflow:hidden;color:#fff;user-select:none}
.vp video{width:100%;height:100%;object-fit:contain;background:#000}
.vbig{position:absolute;width:72px;height:72px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;font-size:30px;color:#fff;transition:opacity .2s}
.vbig svg,.vrow [data-a=play] svg{fill:#fff}
.vbig svg{margin-left:4px}
.vp.playing .vbig{opacity:0;pointer-events:none}
.vc{position:absolute;left:0;right:0;bottom:0;padding:30px 14px 10px;background:linear-gradient(transparent,rgba(0,0,0,.82));transition:opacity .25s}
.vp.idle .vc{opacity:0;pointer-events:none}
.vp.idle{cursor:none}
.vrow{display:flex;align-items:center;gap:2px}
.vrow button{min-width:36px;height:36px;padding:0 8px;border-radius:8px;display:grid;place-items:center;font-size:19px;color:#fff;flex:none}
.vrow button:hover{background:rgba(255,255,255,.2)}
.vrow .vsp{font-size:13px;font-weight:600}
.vt{font-size:13px;font-variant-numeric:tabular-nums;margin:0 8px;white-space:nowrap}
.sp{flex:1}
input[type=range].r{-webkit-appearance:none;appearance:none;height:18px;background:transparent;cursor:pointer;width:100%;display:block;margin:0}
.r::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(to right,var(--pri) var(--p,0%),rgba(255,255,255,.3) var(--p,0%))}
.r::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;margin-top:-4.5px}
.r::-moz-range-track{height:5px;border-radius:3px;background:rgba(255,255,255,.3)}
.r::-moz-range-progress{height:5px;border-radius:3px;background:var(--pri)}
.r::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff}
input[type=range].vvol{width:80px}

@media(max-width:900px){
  body.open{overflow:hidden}
  .sb{transform:translateX(-100%);width:min(280px,82vw)}
  body.open .sb{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .main{margin-left:0}
  .search{width:180px}
  .sbx{display:inline-flex}
}
@media(max-width:640px){
  header{flex-wrap:wrap;padding:10px 14px;gap:8px 10px}
  .search{order:3;flex:1 0 100%;width:100%}
  .pill{width:36px;padding:0}.pill span{display:none}
  .wrap{padding:16px 12px 48px}
  .title{gap:10px;margin-bottom:16px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:24px}
  .card{padding:8px}
  h2{font-size:17px;margin-bottom:12px}
  .meta{font-size:11px;margin-top:8px}
  .nm{font-size:13px;gap:6px}
  .ic{width:20px;height:20px;font-size:12px}
  .th.dir{font-size:44px}
  .stage{padding:56px 6px 60px}
  .lbb{width:40px;height:40px;background:rgba(0,0,0,.5)}
  .pv{left:6px}.nx{right:6px}
  input[type=range].vvol,.vrow [data-a=pip]{display:none}
  .vt{margin:0 4px;font-size:12px}
  .vc{padding:24px 10px 6px}
  .tools{gap:10px;margin:-4px 0 16px}
  .opts{width:100%;justify-content:space-between;gap:10px}
  .sel select{max-width:190px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:2s!important}}
</style>
</head>
<body>
<aside class="sb">
  <div class="brand"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg><span id="site"></span><button class="ibtn sbx" id="sbx" aria-label="Close menu"></button></div>
  <h6>FOLDERS</h6>
  <nav class="nav" id="nav"></nav>
</aside>
<div class="scrim" id="scrim"></div>

<div class="main">
  <header>
    <button class="tg" id="tg" aria-label="Toggle sidebar"></button>
    <a class="pill" href="#/" id="homeBtn"></a>
    <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
    <label class="search"><input id="q" type="search" placeholder="Search in this folder…" aria-label="Search"></label>
    <button class="ibtn" id="fit" aria-label="File thumbnail style"></button>
    <button class="ibtn" id="fth" aria-label="Folder thumbnail style"></button>
    <button class="ibtn" id="theme" aria-label="Toggle dark mode"></button>
  </header>
  <div class="wrap">
    <div class="title" id="bar"></div>
    <div class="tools" id="tools" hidden>
      <div class="chips" id="chips" role="group" aria-label="Filter by type"></div>
      <div class="opts">
        <label class="sel"><span>Sort by</span>
          <select id="sort">
            <option value="name-asc">Name (A–Z)</option>
            <option value="name-desc">Name (Z–A)</option>
            <option value="size-desc">Size (largest first)</option>
            <option value="size-asc">Size (smallest first)</option>
            <option value="type-asc">File type</option>
          </select>
        </label>
        <label class="sw" title="Play videos when you hover over them"><input type="checkbox" id="hov"><i></i><span>Hover preview</span></label>
      </div>
    </div>
    <div id="view"></div>
  </div>
</div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Media viewer">
  <button class="lbb lbx" id="lbx" aria-label="Close"></button>
  <button class="lbb pv" id="pv" aria-label="Previous"></button>
  <button class="lbb nx" id="nx" aria-label="Next"></button>
  <div class="zbar" id="zbar"><button id="zo" aria-label="Zoom out"></button><button id="zl" aria-label="Reset zoom">100%</button><button id="zi" aria-label="Zoom in"></button></div>
  <div class="stage" id="stage"></div>
  <div class="cap" id="cap"></div>
</div>

<script src="config.js"></script>
<script>
(()=>{
const C=typeof CONFIG!=='undefined'?CONFIG:{};
const $=s=>document.querySelector(s);
const P={
  folder:'<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
  image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
  video:'<path d="M23 7l-7 5 7 5z"/><rect x="1" y="5" width="15" height="14" rx="2"/>',
  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
  play:'<path d="M7 4v16l13-8z"/>',
  home:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
  back:'<path d="M19 12H5M12 19l-7-7 7-7"/>',
  left:'<path d="M15 18l-6-6 6-6"/>',
  right:'<path d="M9 18l6-6-6-6"/>',
  x:'<path d="M18 6L6 18M6 6l12 12"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  full:'<path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>',
  crop:'<path d="M6 2v14a2 2 0 0 0 2 2h14M2 6h14a2 2 0 0 1 2 2v14"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  minus:'<path d="M5 12h14"/>',
  pause:'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>',
  vol:'<path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/>',
  mute:'<path d="M11 5L6 9H2v6h4l5 4z"/><path d="M23 9l-6 6M17 9l6 6"/>',
  ccw:'<path d="M1 4v6h6"/><path d="M3.5 15a9 9 0 1 0 2.1-9.4L1 10"/>',
  cw:'<path d="M23 4v6h-6"/><path d="M20.5 15a9 9 0 1 1-2.1-9.4L23 10"/>',
  pip:'<path d="M21 9V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4"/><rect x="12" y="12" width="10" height="8" rx="1"/>',
  layout:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h18M12 3v18"/>'
};
const I=n=>`<svg viewBox="0 0 24 24">${P[n]}</svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc=p=>p.split('/').map(encodeURIComponent).join('/');
const ext=n=>n.includes('.')?n.split('.').pop().toLowerCase():'';
const IMG=new Set(['jpg','jpeg','jfif','png','gif','webp','avif','svg','bmp','ico']);
const VID=new Set(['mp4','webm','mov','m4v','ogv']);
const kind=n=>IMG.has(ext(n))?'image':VID.has(ext(n))?'video':'file';
const size=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(1)+' MB';
const url=it=>it.download_url||enc(it.path);
const alt=it=>enc(it.path);

const view=$('#view'),st={items:[],media:[],lb:-1,req:0,path:''};
const cache=new Map();

/* static chrome */
document.title='File Manager & Gallery';
$('#site').textContent='File Manager';
$('#tg').innerHTML=I('left');
$('#homeBtn').innerHTML=I('home')+'<span>Home</span>';
$('.search').insertAdjacentHTML('beforeend',I('search'));

/* GitHub API */
async function fetchDir(path){
  if(cache.has(path))return cache.get(path);
  if(!C.username||!C.repo||/^your-/.test(C.username))throw new Error('Set your GitHub username and repository in config.js.');
  const h={Accept:'application/vnd.github+json'};
  let r;
  try{r=await fetch(`https://api.github.com/repos/${C.username}/${C.repo}/contents/${enc(path)}?ref=${encodeURIComponent(C.branch||'main')}`,{headers:h})}
  catch{throw new Error('Could not reach GitHub. Check your internet connection and try again.')}
  if(!r.ok){
    if(r.status===404)throw new Error(`"${path}" was not found in ${C.username}/${C.repo} on branch "${C.branch}". Check the names in config.js (they are case-sensitive).`);
    if(r.status===403||r.status===429){
      const t=r.headers.get('x-ratelimit-reset');
      throw new Error('GitHub API rate limit reached.'+(t?` It resets at ${new Date(t*1000).toLocaleTimeString()}.`:'')+' Please try again later.');
    }
    throw new Error(`GitHub returned an error (${r.status}). Try again in a moment.`);
  }
  const data=await r.json();
  if(!Array.isArray(data))throw new Error('This path is a file, not a folder.');
  const items=data.filter(i=>(i.type==='dir'||i.type==='file')&&!i.name.startsWith('.'))
    .sort((a,b)=>(a.type===b.type?0:a.type==='dir'?-1:1)||a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'}));
  cache.set(path,items);
  return items;
}

/* rendering */
function card(it){
  let th,meta,ico,attrs;
  if(it.type==='dir'){
    th=`<div class="th dir" data-fp="${esc(it.path)}">${I('folder')}</div>`;meta='Folder';ico='folder';attrs=`href="#/${enc(it.path)}"`;
  }else{
    const k=kind(it.name),u=esc(url(it)),a=esc(alt(it));ico=k;
    th=k==='image'?`<div class="th"><img class="bl" loading="lazy" aria-hidden="true" alt="" src="${u}"><img loading="lazy" decoding="async" data-alt="${a}" src="${u}" alt="${esc(it.name)}"></div>`
      :k==='video'?`<div class="th"><video preload="metadata" muted playsinline data-alt="${a}" src="${u}#t=0.1"></video><span class="play">${I('play')}</span></div>`
      :`<div class="th file"><b>${esc(ext(it.name).toUpperCase()||'FILE')}</b></div>`;
    meta=`${k==='image'?'Image':k==='video'?'Video':'File'} · ${size(it.size)}`;
    attrs=k==='file'?`href="${u}" target="_blank" rel="noopener"`:`href="${u}" data-m="${st.media.indexOf(it)}"`;
  }
  return `<a class="card" ${attrs}>${th}<div class="meta">${meta}</div><div class="nm"><i class="ic">${I(ico)}</i><span title="${esc(it.name)}">${esc(it.name)}</span></div></a>`;
}
const fcache=new Map();let fio;
async function folderMedia(path,depth=0){
  const items=await fetchDir(path);
  let m=items.filter(i=>i.type==='file'&&kind(i.name)!=='file');
  if(m.length<4&&depth<1){
    for(const d of items.filter(i=>i.type==='dir').slice(0,2)){
      if(m.length>=4)break;
      try{m=m.concat(await folderMedia(d.path,depth+1))}catch{}
    }
  }
  const n=Math.min(4,m.length);
  return Array.from({length:n},(_,i)=>m[Math.floor(i*m.length/n)]);
}
function collage(m){
  const t=m.map(it=>{const u=esc(url(it));return`<span class="ct">${kind(it.name)==='video'?`<video muted playsinline preload="metadata" src="${u}#t=0.1"></video>`:`<img loading="lazy" alt="" src="${u}">`}</span>`}).join('');
  return`<div class="mos m${m.length}">${t}</div><i class="fbadge">${I('folder')}</i>`;
}
async function fillFolder(el){
  const path=el.dataset.fp;
  try{
    let m=fcache.get(path);
    if(!m){m=await folderMedia(path);fcache.set(path,m)}
    if(!m.length||!el.isConnected||!folderThumbs)return;
    el.innerHTML=collage(m);el.classList.add('has');
  }catch{}
}
function hydrate(){
  if(fio)fio.disconnect();
  if(!folderThumbs||!('IntersectionObserver' in window))return;
  const els=[...view.querySelectorAll('.th.dir[data-fp]')];
  if(!els.length)return;
  fio=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){fio.unobserve(en.target);fillFolder(en.target)}}),{rootMargin:'250px'});
  els.forEach(el=>fcache.has(el.dataset.fp)?fillFolder(el):fio.observe(el));
}
const KIND_LABEL={all:'All',dir:'Folders',image:'Images',video:'Videos',file:'Other'};
const kindOf=i=>i.type==='dir'?'dir':kind(i.name);
const cmp=(a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'});
function chips(){
  const n={all:st.items.length};
  st.items.forEach(i=>{const k=kindOf(i);n[k]=(n[k]||0)+1});
  if(st.filter!=='all'&&!n[st.filter])st.filter='all';
  $('#chips').innerHTML=Object.keys(KIND_LABEL).filter(k=>k==='all'||n[k]).map(k=>`<button class="chip${k===st.filter?' on':''}" data-f="${k}" aria-pressed="${k===st.filter}">${KIND_LABEL[k]}<small>${n[k]||0}</small></button>`).join('');
}
function sorted(list){
  if(!st.path)return list;
  const[key,dir]=st.sort.split('-'),sgn=dir==='desc'?-1:1;
  const byName=(a,b)=>cmp(a.name,b.name)*(key==='name'?sgn:1);
  const fn=key==='size'?(a,b)=>((a.size||0)-(b.size||0))*sgn||cmp(a.name,b.name)
    :key==='type'?(a,b)=>cmp(ext(a.name),ext(b.name))||cmp(a.name,b.name):byName;
  return list.sort((a,b)=>(a.type===b.type?0:a.type==='dir'?-1:1)||(a.type==='dir'?byName(a,b):fn(a,b)));
}

function draw(){

  st.media=list.filter(i=>i.type==='file'&&kind(i.name)!=='file');
  if(!list.length)return msg(q||st.filter!=='all'?'Nothing matches your search or filter.':'This folder is empty. Add files to it in your repository.');
  const d=list.filter(i=>i.type==='dir'),f=list.filter(i=>i.type==='file');
  view.innerHTML=(d.length?sec('Folders',d):'')+(f.length?sec('Files',f):'');

function chrome(parts){
  let acc='',h='<a href="#/">Home</a>';
  parts.forEach((p,i)=>{
    acc+=(i?'/':'')+p;
    h+='<span>/</span>'+(i===parts.length-1?`<b>${esc(p)}</b>`:`<a href="#/${enc(acc)}">${esc(p)}</a>`);
  });
  $('#crumbs').innerHTML=h;
  const parent=parts.slice(0,-1).join('/');
  $('#bar').innerHTML=(parts.length?`<a class="back" href="#/${enc(parent)}">${I('back')}Go Back</a>`:'')+
    `<h1>${esc(parts.length?parts[parts.length-1]:'Home')}</h1><small id="cnt"></small>`;
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===(parts[0]||'')));
}
async function render(){
  let path='';
  try{path=decodeURIComponent(location.hash.slice(2)).replace(/^\/+|\/+$/g,'')}catch{}
  const parts=path?path.split('/'):[];
  if(parts.length&&!(C.customFolders||[]).includes(parts[0])){location.hash='#/';return}
  closeLB();document.body.classList.remove('open');
  $('#q').value='';st.filter='all';st.path=path;$('#tools').hidden=true;scrollTo(0,0);chrome(parts);
  const my=++st.req;
  if(!path){
    st.items=(C.customFolders||[]).map(n=>({type:'dir',name:n,path:n}));
    if(!st.items.length)return msg('No folders found. Check that config.js loads and customFolders has folder names.',true);
    return finish();
  }
  view.innerHTML='<div class="state"><div class="spin"></div><p>Loading from GitHub…</p></div>';
  try{
    const items=await fetchDir(path);
    if(my!==st.req)return;
    st.items=items;finish();
  }catch(e){if(my===st.req)msg(e.message,true)}
}
function finish(){
  const n=st.items.length;
  $('#cnt').textContent=n+(n===1?' item':' items');
  $('#tools').hidden=!st.path||!n;chips();
  draw();
}

/* lightbox */
const lb=$('#lb'),stage=$('#stage');
function showLB(){
  const it=st.media[st.lb],u=url(it),vid=kind(it.name)==='video';let tried=0,el;
  const retry=()=>{if(tried)return false;tried=1;el.src=alt(it);return true};
  stage.innerHTML='';stage.classList.remove('ld');
  if(vid){const w=player();el=w.v;el.onerror=retry;el.src=u;stage.append(w);el.play().catch(()=>{})}
  else{
    el=new Image();el.alt=it.name;el.draggable=false;stage.classList.add('ld');
    el.onload=()=>stage.classList.remove('ld');
    el.onerror=()=>{if(!retry())stage.classList.remove('ld')};

  Z.s=1;Z.x=Z.y=0;applyZ();$('#zbar').hidden=vid;

/* video player */
const fmt=t=>{if(!isFinite(t))return'0:00';const h=Math.floor(t/3600),m=Math.floor(t%3600/60),x=String(Math.floor(t%60)).padStart(2,'0');return h?`${h}:${String(m).padStart(2,'0')}:${x}`:`${m}:${x}`};
const SPD=[.5,.75,1,1.25,1.5,2];
function player(){
  const w=document.createElement('div');w.className='vp';
  w.innerHTML=`<video playsinline preload="metadata"></video><button class="vbig" aria-label="Play">${I('play')}</button><div class="vc"><input class="r vs" type="range" min="0" max="1000" value="0" aria-label="Seek"><div class="vrow"><button data-a="play" aria-label="Play or pause"></button><button data-a="back" title="Back 10 seconds">${I('ccw')}</button><button data-a="fwd" title="Forward 10 seconds">${I('cw')}</button><button data-a="mute" aria-label="Mute"></button><input class="r vvol" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume"><span class="vt">0:00 / 0:00</span><span class="sp"></span><button data-a="speed" class="vsp" title="Playback speed">1×</button>${document.pictureInPictureEnabled?`<button data-a="pip" title="Picture in picture">${I('pip')}</button>`:''}<button data-a="fs" title="Fullscreen">${I('full')}</button></div></div>`;
  const v=w.querySelector('video'),q=x=>w.querySelector(x),seek=q('.vs'),vol=q('.vvol'),tm=q('.vt'),pb=q('[data-a=play]'),mb=q('[data-a=mute]');
  let idleT,drag=false;
  const paint=()=>{pb.innerHTML=I(v.paused?'play':'pause');w.classList.toggle('playing',!v.paused)};
  const mpaint=()=>{mb.innerHTML=I(v.muted||!v.volume?'mute':'vol');vol.value=v.muted?0:v.volume;vol.style.setProperty('--p',vol.value*100+'%')};
  const tick=()=>{const d=v.duration||0;if(!drag){seek.value=d?v.currentTime/d*1000:0;seek.style.setProperty('--p',seek.value/10+'%')}tm.textContent=fmt(v.currentTime)+' / '+fmt(d)};
  const wake=()=>{w.classList.remove('idle');clearTimeout(idleT);if(!v.paused)idleT=setTimeout(()=>w.classList.add('idle'),2500)};
  const toggle=()=>{v.paused?v.play().catch(()=>{}):v.pause()};
  const skip=d=>{v.currentTime=Math.max(0,Math.min(v.duration||0,v.currentTime+d))};
  const fs=()=>{
    if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);
    else if(w.requestFullscreen)w.requestFullscreen();
    else if(w.webkitRequestFullscreen)w.webkitRequestFullscreen();
    else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen();
  };
  v.autoplay=true;
  ['play','pause','ended'].forEach(n=>v.addEventListener(n,()=>{paint();wake()}));
  v.addEventListener('timeupdate',tick);v.addEventListener('loadedmetadata',tick);v.addEventListener('volumechange',mpaint);
  seek.oninput=()=>{drag=true;v.currentTime=seek.value/1000*(v.duration||0);seek.style.setProperty('--p',seek.value/10+'%');tick()};
  seek.onchange=()=>{drag=false};
  vol.oninput=()=>{v.muted=false;v.volume=+vol.value};
  v.onclick=toggle;q('.vbig').onclick=toggle;
  w.addEventListener('pointermove',wake);w.addEventListener('pointerdown',wake);
  q('.vrow').onclick=e=>{
    const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;
    if(a==='play')toggle();else if(a==='back')skip(-10);else if(a==='fwd')skip(10);
    else if(a==='mute')v.muted=!v.muted;
    else if(a==='speed'){const i=(SPD.indexOf(v.playbackRate)+1)%SPD.length;v.playbackRate=SPD[i];b.textContent=SPD[i]+'×'}
    else if(a==='pip')(document.pictureInPictureElement?document.exitPictureInPicture():v.requestPictureInPicture()).catch(()=>{});
    else if(a==='fs')fs();
  };
  w.api={toggle,skip,fs,mute:()=>{v.muted=!v.muted}};w.v=v;paint();mpaint();
  return w;
}

const Z={s:1,x:0,y:0},curImg=()=>stage.querySelector('img');
function applyZ(){
  const im=curImg();
  if(im)im.style.transform=Z.s===1?'':`translate(${Z.x}px,${Z.y}px) scale(${Z.s})`;
  stage.classList.toggle('zoomed',Z.s>1);$('#zl').textContent=Math.round(Z.s*100)+'%';
}
function zoomTo(s,cx,cy){
  s=Math.min(8,Math.max(1,s));const k=s/Z.s;
  Z.x=cx-(cx-Z.x)*k;Z.y=cy-(cy-Z.y)*k;Z.s=s;
  if(s===1)Z.x=Z.y=0;
  applyZ();
}
$('#zi').onclick=()=>zoomTo(Z.s*1.4,0,0);
$('#zo').onclick=()=>zoomTo(Z.s/1.4,0,0);
$('#zl').onclick=()=>zoomTo(1,0,0);
const pts=new Map();let p0=null,lastTap=0;
const rel=(x,y)=>{const r=stage.getBoundingClientRect();return[x-r.left-r.width/2,y-r.top-r.height/2]};
const two=()=>{const[a,b]=[...pts.values()];return{d:Math.hypot(a[0]-b[0],a[1]-b[1])||1,c:rel((a[0]+b[0])/2,(a[1]+b[1])/2)}};
stage.addEventListener('wheel',e=>{
  if(!curImg())return;e.preventDefault();
  const[cx,cy]=rel(e.clientX,e.clientY);
  zoomTo(Z.s*(e.deltaY<0?1.15:1/1.15),cx,cy);
},{passive:false});
stage.addEventListener('pointerdown',e=>{
  const im=curImg();if(!im||e.target!==im)return;
  im.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);
  p0={x:e.clientX,y:e.clientY,zx:Z.x,zy:Z.y,s:Z.s,d:pts.size===2?two().d:0,mv:pts.size===2};
});
stage.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)||!p0)return;
  pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size===2){const t=two();zoomTo(p0.s*t.d/p0.d,t.c[0],t.c[1]);return}
  const dx=e.clientX-p0.x,dy=e.clientY-p0.y;
  if(Math.abs(dx)+Math.abs(dy)>8)p0.mv=true;
  if(Z.s>1){Z.x=p0.zx+dx;Z.y=p0.zy+dy;applyZ()}
});
const up=e=>{
  if(!pts.delete(e.pointerId)||!p0)return;
  if(pts.size){const[x,y]=[...pts.values()][0];p0={x,y,zx:Z.x,zy:Z.y,s:Z.s,d:0,mv:true};return}
  const dx=e.clientX-p0.x;
  if(!p0.mv){
    const n=Date.now();
    if(n-lastTap<300){const[cx,cy]=rel(e.clientX,e.clientY);zoomTo(Z.s>1?1:2.5,cx,cy);lastTap=0}else lastTap=n;
  }else if(Z.s===1&&e.pointerType!=='mouse'&&Math.abs(dx)>60&&st.media.length>1)step(dx<0?1:-1);
  p0=null;
};
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
lb.addEventListener('click',e=>{if(e.target===lb||e.target===stage)closeLB()});
addEventListener('keydown',e=>{
  const k=e.key,b=document.body.classList;
  if(k==='Escape'&&b.contains('open')){b.remove('open');return}
  if(st.lb<0)return;
  if(k==='Escape'){closeLB();return}
  if(e.target.tagName==='INPUT')return;
  const api=stage.firstChild&&stage.firstChild.api;
  if(api){
    if((k===' '||k==='k')&&e.target.tagName!=='BUTTON'){e.preventDefault();api.toggle()}
    else if(k==='ArrowLeft'){e.preventDefault();api.skip(-5)}
    else if(k==='ArrowRight'){e.preventDefault();api.skip(5)}
    else if(k==='m')api.mute();
    else if(k==='f')api.fs();
    else if(k==='PageUp')step(-1);
    else if(k==='PageDown')step(1);
  }
  else if(k==='ArrowLeft')step(-1);
  else if(k==='ArrowRight')step(1);
  else if(k==='+'||k==='=')zoomTo(Z.s*1.4,0,0);
  else if(k==='-')zoomTo(Z.s/1.4,0,0);
  else if(k==='0')zoomTo(1,0,0);
});

render();
})();
</script>
